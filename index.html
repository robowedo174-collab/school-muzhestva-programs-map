<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Карта 49 качеств Школы Мужества</title>
    <link rel="stylesheet" href="styles.css?v=2026-05-12-strategic-map">
  </head>
  <body class="simple-map-page">
    <div class="full-map-shell" id="appShell">
      <header class="full-map-toolbar">
        <div class="toolbar-title">
          <h1>Карта 49 качеств Школы Мужества</h1>
          <p>Утверждённый идеал → возрастной перевод → программы</p>
        </div>

        <nav class="view-switcher" aria-label="Режим просмотра">
          <button class="view-switcher-button active" type="button" data-view-mode="qualities">Карта 49 качеств</button>
          <button class="view-switcher-button" type="button" data-view-mode="programs">Карта программ</button>
          <button class="view-switcher-button" type="button" data-view-mode="strategic">Стратегическая карта</button>
        </nav>

        <div class="toolbar-controls">
          <label class="full-search">
            <span>Поиск</span>
            <input id="fullSearchInput" type="search" placeholder="3.3 или справедливость">
          </label>
          <button class="button secondary" id="showHelpButton" type="button">Как читать карту</button>
        </div>

        <div id="fullProgramLegend" class="full-program-legend" aria-label="Подсветка программ"></div>
      </header>

      <main class="full-map-main" aria-label="Карта 49 качеств и программ">
        <section id="qualitiesView" class="site-view active" aria-label="Таблица 49 качеств">
          <div id="fullQualityMap" class="full-map-grid"></div>
        </section>

        <section id="programsView" class="site-view programs-view" aria-label="Карта программ">
          <div class="section-heading compact">
            <h2>Карта программ</h2>
            <p>Рабочие переходы программ и ведущие качества. Подтверждение качества в основной таблице всё равно считается только по воспитательным событиям.</p>
          </div>
          <div id="programCards" class="program-grid"></div>
        </section>

        <section id="strategicCoverageView" class="site-view strategic-coverage-view" aria-label="Стратегическая карта"></section>
      </main>
    </div>

    <div id="qualityModal" class="modal-shell" hidden></div>
    <div id="eventModal" class="modal-shell event-modal-shell" hidden></div>
    <div id="helpModal" class="modal-shell" hidden></div>

    <script src="app.js?v=2026-05-12-strategic-map"></script>
  </body>
</html>
